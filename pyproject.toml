[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-sql_gym"
version = "0.3.0"
description = "SQL Query Optimization environment for OpenEnv — trains agents to rewrite slow queries for measurable speedup"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "sql_gym.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["sql_gym", "sql_gym.server", "sql_gym.server.tasks"]
package-dir = { "sql_gym" = ".", "sql_gym.server" = "server", "sql_gym.server.tasks" = "server/tasks" }
